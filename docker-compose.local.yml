services:
  gymhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymhub-api
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  gymhub-web:
    build:
      context: ../gymhub
      dockerfile: Dockerfile
    container_name: gymhub-web
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ../gymhub:/app
      - /app/node_modules
    depends_on:
      - gymhub-api
    restart: unless-stopped

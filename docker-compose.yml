services:
  gymhub-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymhub-api
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
